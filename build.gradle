plugins {
    alias(libs.plugins.licenser) apply false
    id 'org.cyclonedx.bom' version '3.0.1'
    alias(libs.plugins.loom) apply false
}

import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.gradle.api.tasks.testing.logging.TestLogEvent

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'
    apply plugin: 'dev.yumi.gradle.licenser'

    // Must match the `groupId` the publications use. Upstream keeps these two
    // apart (`me.lucko.luckperms` here, `net.luckperms` in the publication),
    // which makes every project dependency in a generated POM depend on
    // Gradle's project-dependency coordinate mapping to come out right, and
    // makes the `include(dependency('net.luckperms:.*'))` shadow filters match
    // nothing. Keeping them identical removes both traps.
    group = 'net.luckperms'
    // The single source of truth for the version. Release Please rewrites this
    // line (and only this line) via the `generic` extra-files updater; see
    // release-please-config.json. Do not bump it by hand.
    version = '5.6.0' // x-release-please-version

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 11
    }

    tasks.withType(Test).configureEach {
        testLogging {
            events = [TestLogEvent.PASSED, TestLogEvent.FAILED, TestLogEvent.SKIPPED]
            exceptionFormat = TestExceptionFormat.FULL
            showExceptions = true
            showCauses = true
            showStackTraces = true
        }
    }

    jar {
        from '../LICENSE.txt'
    }

    // Everything below is derived from the single `version` assignment above -
    // nothing is read from the git history, so Release Please stays the only
    // thing that ever decides what the version is.
    def versionParts = project.version.toString().split('-')[0].split('\\.')

    project.ext.majorVersion = versionParts[0]
    project.ext.minorVersion = versionParts.length > 1 ? versionParts[1] : '0'
    project.ext.patchVersion = versionParts.length > 2 ? versionParts[2] : '0'
    project.ext.apiVersion = project.ext.majorVersion + '.' + project.ext.minorVersion
    project.ext.fullVersion = project.version.toString()

    license {
        rule(rootProject.file("HEADER.txt"))
        exclude '*.xml'
    }

    repositories {
        // Fix issue with lwjgl-freetype not being found on macOS / ForgeGradle issue
        //
        // Could not resolve all files for configuration ':_compileJava_1'.
        // Could not find lwjgl-freetype-3.3.3-natives-macos-patch.jar (org.lwjgl:lwjgl-freetype:3.3.3).
        maven {
            url "https://libraries.minecraft.net"
            content {
                includeModule("org.lwjgl", "lwjgl-freetype")
            }
        }
        mavenCentral()
        maven { url 'https://repo.lucko.me/' }
        maven { url 'https://libraries.minecraft.net/' }
    }
}

// Every module this fork publishes to the OneLiteFeather repository, mapped to
// its published artifactId and its human-readable name. The javadoc, javadoc/
// sources jar and publishing setup below used to be copy-pasted into each of
// these five build scripts nearly verbatim; it lives here exactly once now.
//
// Adding a module to this map is all it takes to publish it.
def olfPublications = [
        ':api'            : ['api', 'LuckPerms API'],
        ':common'         : ['common', 'LuckPerms Common'],
        ':minestom'       : ['minestom', 'LuckPerms Minestom'],
        ':minestom:app'   : ['minestom-app', 'LuckPerms Minestom App'],
        ':minestom:loader': ['minestom-loader', 'LuckPerms Minestom Loader'],
        ':minestom:library': ['minestom-library', 'LuckPerms Minestom Library'],
        ':minestom:extension': ['minestom-extension', 'LuckPerms Minestom Extension'],
]

subprojects {
    afterEvaluate { proj ->
        def entry = olfPublications[proj.path]
        if (entry == null) {
            return
        }

        def publishedArtifactId = entry[0]
        def displayName = entry[1]

        // Only used occasionally for deployment - not needed for normal builds.
        proj.javadoc {
            title = displayName + ' (v' + proj.ext.apiVersion + ')'
            options.overview = 'javadoc/overview.html'
            options.encoding = 'UTF-8'
            options.charSet = 'UTF-8'
            options.links(
                    'https://checkerframework.org/api/',
                    'https://www.javadocs.dev/org.jetbrains/annotations/26.0.2/'
            )
            options.addStringOption('Xdoclint:none', '-quiet')
            options.addStringOption('-since', '5.0,5.1,5.2,5.3,5.4,5.5')

            if (JavaVersion.current() > JavaVersion.VERSION_1_8) {
                options.links.add('https://docs.oracle.com/en/java/javase/21/docs/api/')
            } else {
                options.links.add('https://docs.oracle.com/javase/8/docs/api/')
            }
        }

        // Has to run before the publication reads components.java, otherwise
        // the javadoc and sources jars are missing from the published module.
        proj.java {
            withJavadocJar()
            withSourcesJar()
        }

        proj.publishing {
            repositories {
                maven {
                    name = 'OneLiteFeatherRepository'

                    def releasesRepoUrl = uri('https://repo.onelitefeather.dev/onelitefeather-releases')
                    def snapshotsRepoUrl = uri('https://repo.onelitefeather.dev/onelitefeather-snapshots')

                    url = (proj.version.toString().contains('BETA')
                            || proj.version.toString().contains('ALPHA')
                            || proj.version.toString().contains('SNAPSHOT')) ? snapshotsRepoUrl : releasesRepoUrl

                    credentials(PasswordCredentials) {
                        username = System.getenv('ONELITEFEATHER_MAVEN_USERNAME')
                        password = System.getenv('ONELITEFEATHER_MAVEN_PASSWORD')
                    }

                    authentication {
                        basic(BasicAuthentication)
                    }
                }
            }

            publications {
                mavenJava(MavenPublication) {
                    artifactId = publishedArtifactId
                    groupId = 'net.luckperms'

                    if (proj.path == ':minestom:loader') {
                        // The loader's whole point is the fat JarInJar - the
                        // thin jar would be useless to a consumer.
                        artifact(proj.tasks.shadowJar) {
                            classifier = null
                            builtBy(proj.tasks.shadowJar)
                        }
                    } else {
                        from proj.components.java
                    }

                    pom {
                        name = displayName
                        description = 'A permissions manager for Minecraft servers.'
                        url = 'https://luckperms.net'

                        licenses {
                            license {
                                name = 'MIT'
                                url = 'https://opensource.org/licenses/MIT'
                            }
                        }

                        developers {
                            developer {
                                id = 'lucko'
                                name = 'Luck'
                                url = 'https://lucko.me'
                                email = 'git@lucko.me'
                            }
                        }

                        scm {
                            connection = 'scm:git:https://github.com/OneLiteFeatherNET/LuckPerms.git'
                            developerConnection = 'scm:git:git@github.com:OneLiteFeatherNET/LuckPerms.git'
                            url = 'https://github.com/OneLiteFeatherNET/LuckPerms'
                        }

                        issueManagement {
                            system = 'GitHub'
                            url = 'https://github.com/OneLiteFeatherNET/LuckPerms/issues'
                        }
                    }
                }
            }
        }
    }
}
