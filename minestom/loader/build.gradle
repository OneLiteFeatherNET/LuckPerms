plugins {
    alias(libs.plugins.shadow)
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'net.minestom:minestom:2026.07.22-26.2'

    implementation project(':api')
    implementation project(':common:loader-utils')
    implementation project(':minestom:app')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

shadowJar {
    archiveFileName = "LuckPerms-Minestom-${project.ext.fullVersion}.jar"

    from {
        project(':minestom').tasks.shadowJar.archiveFile
    }

    // Minestom ships Adventure itself, so the loader must not bundle its own
    // copy - it would shadow the host's (newer) version and break it. The
    // platform code resolves Adventure from the host classpath instead.
    exclude 'net/kyori/adventure/**'
    exclude 'net/kyori/examination/**'
    exclude 'net/kyori/option/**'
    exclude 'net/kyori/ansi/**'
}

artifacts {
    archives shadowJar
}
