name: Build and Publish LuckPerms Minestom

on:
  push:
    branches:
      - 'master'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'master'

concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build-gradle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This fork ships only the Minestom platform (LuckPerms is on Adventure 5 /
      # Minestom 2026; the other platforms stay on Adventure 4 and are not built).
      - name: Build Minestom loader
        run: ./gradlew :minestom:loader:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Minestom artifacts
        if: github.event_name != 'pull_request'
        run: ./gradlew :minestom:publish :minestom:app:publish :minestom:loader:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONELITEFEATHER_MAVEN_USERNAME: ${{ secrets.ONELITEFEATHER_MAVEN_USERNAME }}
          ONELITEFEATHER_MAVEN_PASSWORD: ${{ secrets.ONELITEFEATHER_MAVEN_PASSWORD }}

      - name: Publish test report
        uses: mikepenz/action-junit-report@v5
        if: success() || failure()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          annotate_notice: true
          detailed_summary: true

      - name: Upload Minestom loader artifact
        uses: actions/upload-artifact@v4
        with:
          name: minestom-loader
          path: minestom/loader/build/libs/LuckPerms-Minestom-*.jar
