plugins {
    alias(libs.plugins.blossom)
    id("java-library")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

dependencies {
    implementation project(':api')

    // This module is the contract layer: it is on the host's application class
    // loader, so host-facing helpers such as LuckPermsCommandConditions have to
    // live here. They speak Minestom types, but Minestom is provided by the
    // host at runtime and must never be bundled - hence compileOnly.
    compileOnly 'net.minestom:minestom:2026.07.22-26.2'

    // LuckPermsMinestomOptions carries an slf4j Logger. Minestom itself requires
    // slf4j, so the host always has it - bundling a second copy would be wrong.
    compileOnly 'org.slf4j:slf4j-api:2.0.17'

    api('net.kyori:adventure-api:5.2.0') {
        exclude(module: 'adventure-bom')
        exclude(module: 'checker-qual')
        exclude(module: 'annotations')
    }
    api('net.kyori:adventure-text-serializer-gson:5.2.0') {
        exclude(module: 'adventure-bom')
        exclude(module: 'adventure-api')
        exclude(module: 'gson')
    }
    api('net.kyori:adventure-text-serializer-legacy:5.2.0') {
        exclude(module: 'adventure-bom')
        exclude(module: 'adventure-api')
    }
    api('net.kyori:adventure-text-serializer-plain:5.2.0') {
        exclude(module: 'adventure-bom')
        exclude(module: 'adventure-api')
    }
    api('net.kyori:adventure-text-minimessage:5.2.0') {
        exclude(module: 'adventure-bom')
        exclude(module: 'adventure-api')
    }
    api('net.kyori:adventure-text-serializer-ansi:5.2.0') {
        exclude(module: 'adventure-bom')
        exclude(module: 'adventure-api')
        exclude(module: 'annotations')
    }
    api('net.kyori:ansi:1.1.1') {
        exclude(module: 'annotations')
    }
}

sourceSets {
    main {
        blossom {
            javaSources {
                property 'version', project.ext.fullVersion
            }
        }
    }
}
