# Build and test only. Publishing is owned by release-please.yml, which chains
# the OneLiteFeather gradle-publish workflow onto an actual Release Please
# release - there is deliberately no tag trigger and no publish step here.
name: Build LuckPerms Minestom

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'

concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build-gradle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The standalone module holds this fork's integration tests. They run
      # against ':common' - the code the Adventure 5 migration touched - so they
      # are the regression gate for the Minestom platform too. Tests tagged
      # 'docker' are excluded unless -PdockerTests is passed.
      - name: Run tests
        run: ./gradlew :standalone:test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # This fork ships only the Minestom platform (LuckPerms is on Adventure 5 /
      # Minestom 2026; the other platforms stay on Adventure 4 and are not built).
      - name: Build Minestom loader
        run: ./gradlew :minestom:loader:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish test report
        uses: mikepenz/action-junit-report@v5
        if: success() || failure()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          annotate_notice: true
          detailed_summary: true

      - name: Upload Minestom loader artifact
        uses: actions/upload-artifact@v4
        with:
          name: minestom-loader
          path: minestom/loader/build/libs/LuckPerms-Minestom-*.jar
