pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id("org.gradle.toolchains.foojay-resolver-convention") version("1.0.0")
}

rootProject.name = 'luckperms'

// This fork ships only the Minestom platform (LuckPerms on Adventure 5 /
// Minestom 2026). The other platform modules stay in the tree but are not part
// of the build - they remain on Adventure 4 and would not compile against the
// Adventure-5 common.
include (
        'api',
        'common',
        'common:loader-utils',
        'minestom',
        'minestom:loader',
        'minestom:app',
        // Included for its test suite: standalone hosts the integration tests
        // that exercise ':common', so it is the only module that gives this
        // fork actual test coverage.
        'standalone',
        'standalone:app',
        'standalone:loader'
)

