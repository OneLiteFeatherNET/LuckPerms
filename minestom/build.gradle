plugins {
    alias(libs.plugins.shadow)
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':common')
    compileOnly project(':common:loader-utils')
    compileOnly project(':minestom:app')

    // Minestom does not ship Guava, but ~95 classes in :common import it and
    // there is no Dependency.GUAVA entry that could download it at runtime.
    // It therefore has to be bundled. Version matches standalone/app, which is
    // the upstream module that also has to supply Guava itself.
    implementation 'com.google.guava:guava:33.4.8-jre'

    compileOnly 'net.minestom:minestom:2026.07.22-26.2'
    compileOnly 'org.slf4j:slf4j-api:2.0.17'
}

shadowJar {
    // Name the platform jar with a non-archive extension so the loader embeds
    // it as an isolated nested JarInJar instead of exploding it inline.
    archiveFileName = 'luckperms-minestom.jarinjar'

    dependencies {
        // Bundle only the LuckPerms implementation into the jarinjar.
        // The group has to match the one the root build.gradle assigns to every
        // subproject - project dependencies are resolved under it, so a stale
        // group here silently produces an empty jarinjar.
        include(dependency('net.luckperms:.*'))
        include(dependency('com.google.guava:.*'))
    }

    // Guava is deliberately NOT relocated.
    //
    // The hytale module relocates it, but that pattern does not work here: the
    // dependencies LuckPerms downloads at runtime (configurate-core in
    // particular) are remapped with the rules from Dependency.java, and there
    // is no relocation rule for com.google.common anywhere. Their Guava
    // references therefore stay unrelocated, so a relocated Guava produces
    // "NoClassDefFoundError: com/google/common/base/Splitter" the moment the
    // config is read. Every upstream platform relies on the host providing an
    // unrelocated Guava; Minestom does not, so we ship one inside the jarinjar.
    //
    // This is safe because the jarinjar has its own class loader and delegates
    // parent-first: a host that brings its own Guava keeps winning, and our
    // copy never leaks onto the host classpath.

    // Minestom exposes Adventure natively (v5), so it stays unrelocated and is
    // shared with the host. Every other bundled library is relocated to avoid
    // clashing with the host classpath.
    relocate 'net.kyori.event', 'me.lucko.luckperms.lib.eventbus'
    relocate 'com.github.benmanes.caffeine', 'me.lucko.luckperms.lib.caffeine'
    relocate 'okio', 'me.lucko.luckperms.lib.okio'
    relocate 'okhttp3', 'me.lucko.luckperms.lib.okhttp3'
    relocate 'net.bytebuddy', 'me.lucko.luckperms.lib.bytebuddy'
    relocate 'me.lucko.commodore', 'me.lucko.luckperms.lib.commodore'
    relocate 'org.mariadb.jdbc', 'me.lucko.luckperms.lib.mariadb'
    relocate 'com.mysql', 'me.lucko.luckperms.lib.mysql'
    relocate 'org.postgresql', 'me.lucko.luckperms.lib.postgresql'
    relocate 'com.zaxxer.hikari', 'me.lucko.luckperms.lib.hikari'
    relocate 'com.mongodb', 'me.lucko.luckperms.lib.mongodb'
    relocate 'org.bson', 'me.lucko.luckperms.lib.bson'
    relocate 'redis.clients.jedis', 'me.lucko.luckperms.lib.jedis'
    relocate 'io.nats.client', 'me.lucko.luckperms.lib.nats'
    relocate 'com.rabbitmq', 'me.lucko.luckperms.lib.rabbitmq'
    relocate 'org.apache.commons.pool2', 'me.lucko.luckperms.lib.commonspool2'
    relocate 'ninja.leaping.configurate', 'me.lucko.luckperms.lib.configurate'
    relocate 'org.yaml.snakeyaml', 'me.lucko.luckperms.lib.yaml'
}

artifacts {
    archives shadowJar
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}
