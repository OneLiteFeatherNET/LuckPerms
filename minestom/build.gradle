plugins {
    alias(libs.plugins.shadow)
}

repositories {
    mavenCentral()
}
group = 'net.luckperms'
dependencies {
    implementation project(':common')
    compileOnly project(':common:loader-utils')
    compileOnly project(':minestom:app')

    compileOnly 'net.minestom:minestom:2025.08.29-1.21.8'
}

shadowJar {
    archiveFileName = 'luckperms-minestom.jarinjar'

    dependencies {
        // :common and :api are published under net.luckperms in this fork, the
        // platform sources under me.lucko.luckperms - include both so the whole
        // LuckPerms implementation ends up inside the jarinjar.
        include(dependency('net.luckperms:.*'))
        include(dependency('me.lucko.luckperms:.*'))
    }

    // Minestom exposes Adventure natively, so it must stay unrelocated and be
    // shared with the host platform (like the standalone build). Every other
    // bundled library is relocated to avoid clashing with the host classpath.
    relocate 'net.kyori.event', 'me.lucko.luckperms.lib.eventbus'
    relocate 'com.github.benmanes.caffeine', 'me.lucko.luckperms.lib.caffeine'
    relocate 'okio', 'me.lucko.luckperms.lib.okio'
    relocate 'okhttp3', 'me.lucko.luckperms.lib.okhttp3'
    relocate 'net.bytebuddy', 'me.lucko.luckperms.lib.bytebuddy'
    relocate 'me.lucko.commodore', 'me.lucko.luckperms.lib.commodore'
    relocate 'org.mariadb.jdbc', 'me.lucko.luckperms.lib.mariadb'
    relocate 'com.mysql', 'me.lucko.luckperms.lib.mysql'
    relocate 'org.postgresql', 'me.lucko.luckperms.lib.postgresql'
    relocate 'com.zaxxer.hikari', 'me.lucko.luckperms.lib.hikari'
    relocate 'com.mongodb', 'me.lucko.luckperms.lib.mongodb'
    relocate 'org.bson', 'me.lucko.luckperms.lib.bson'
    relocate 'redis.clients.jedis', 'me.lucko.luckperms.lib.jedis'
    relocate 'io.nats.client', 'me.lucko.luckperms.lib.nats'
    relocate 'com.rabbitmq', 'me.lucko.luckperms.lib.rabbitmq'
    relocate 'org.apache.commons.pool2', 'me.lucko.luckperms.lib.commonspool2'
    relocate 'ninja.leaping.configurate', 'me.lucko.luckperms.lib.configurate'
    relocate 'org.yaml.snakeyaml', 'me.lucko.luckperms.lib.yaml'
}

artifacts {
    archives shadowJar
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

// Only used occasionally for deployment - not needed for normal builds.
javadoc {
    title = 'LuckPerms Minestom (v' + project.ext.apiVersion + ')'
    options.overview = 'javadoc/overview.html'
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.links(
            'https://checkerframework.org/api/',
            'https://www.javadocs.dev/org.jetbrains/annotations/26.0.2/'
    )
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addStringOption('-since', '5.0,5.1,5.2,5.3,5.4,5.5')

    if (JavaVersion.current() > JavaVersion.VERSION_1_8) {
        options.links.add('https://docs.oracle.com/en/java/javase/21/docs/api/')
    } else {
        options.links.add('https://docs.oracle.com/javase/8/docs/api/')
    }
}

java {
    withJavadocJar()
    withSourcesJar()
}

publishing {
    repositories {
        maven {
            name = 'OneLiteFeatherRepository'

            def releasesRepoUrl = uri('https://repo.onelitefeather.dev/onelitefeather-releases')
            def snapshotsRepoUrl = uri('https://repo.onelitefeather.dev/onelitefeather-snapshots')

            url = (version.toString().contains('BETA')
                    || version.toString().contains('ALPHA')
                    || version.toString().contains('SNAPSHOT')) ? snapshotsRepoUrl : releasesRepoUrl

            credentials(PasswordCredentials) {
                username = System.getenv('ONELITEFEATHER_MAVEN_USERNAME')
                password = System.getenv('ONELITEFEATHER_MAVEN_PASSWORD')
            }

            authentication {
                basic(BasicAuthentication)
            }
        }
    }

    publications {
        mavenJava(MavenPublication) {
            artifactId = 'minestom'

            from components.java

            pom {
                name = 'LuckPerms Minestom'
                description = 'A permissions manager for Minecraft servers.'
                url = 'https://luckperms.net'

                licenses {
                    license {
                        name = 'MIT'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }

                developers {
                    developer {
                        id = 'lucko'
                        name = 'Luck'
                        url = 'https://lucko.me'
                        email = 'git@lucko.me'
                    }
                }

                scm {
                    connection = 'scm:git:https://github.com/OneLiteFeatherNET/LuckPerms.git'
                    developerConnection = 'scm:git:git@github.com:OneLiteFeatherNET/LuckPerms.git'
                    url = 'https://github.com/OneLiteFeatherNET/LuckPerms'
                }

                issueManagement {
                    system = 'GitHub'
                    url = 'https://github.com/OneLiteFeatherNET/LuckPerms/issues'
                }
            }
        }
    }
}
